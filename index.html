<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love You Heart</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; }
  #ui { perspective: 1100px; width: 100vmin; height: 100vmin; position: relative; }
  #scene {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    animation: spin 10000ms ease-in-out infinite alternate;
  }
  /* each word sits on the heart outline, its text running along the depth axis */
  #ui .pin {
    position: absolute; left: 50%; top: 50%;
    transform-style: preserve-3d;
  }
  #ui .love_word {
    display: block;
    color: #ea80b0;
    font: 1.4rem/1 "Courier New", monospace;
    text-shadow: 0 0 10px #fff;
    letter-spacing: 2px;
    white-space: nowrap;
    transform: rotateY(90deg) translateX(-50%) translateY(-50%);
  }
  #ui .love_horizontal {
    animation: horizontal 10000ms infinite alternate ease-in-out;
    animation-delay: calc(var(--i) * -300ms);
  }
  @keyframes horizontal {
    from { translate: 0 0 -18px; }
    to   { translate: 0 0 18px; }
  }
  @keyframes spin {
    from { transform: rotateX(18deg) rotateY(-38deg) rotateZ(-4deg); }
    to   { transform: rotateX(18deg) rotateY(38deg)  rotateZ(4deg); }
  }
  @media (max-width: 600px) { #ui .love_word { font-size: 1rem; } }
</style>
</head>
<body>
<div id="ui"><div id="scene"></div></div>
<script>
  const scene = document.getElementById('scene');
  const N = 96;
  const S = Math.min(innerWidth, innerHeight) * 0.6 / 32;   // heart is ~32 units wide
  for (let n = 0; n < N; n++) {
    const t = (n / N) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    const pin = document.createElement('div');
    pin.className = 'pin';
    pin.style.transform = `translate3d(${x*S}px, ${-y*S}px, 0)`;
    const w = document.createElement('span');
    w.className = 'love_word love_horizontal';
    w.style.setProperty('--i', n);
    w.textContent = 'love you';
    pin.appendChild(w);
    scene.appendChild(pin);
  }
</script>
</body>
</html>
